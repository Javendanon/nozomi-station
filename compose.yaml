services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  liquidsoap:
    image: savonet/liquidsoap:v2.4.5
    user: "${LIQUIDSOAP_UID:-100}:${LIQUIDSOAP_GID:-101}"
    init: true
    restart: unless-stopped
    command: /etc/liquidsoap/radio.liq
    environment:
      RADIO_MEDIA_DIR: ${LIQUIDSOAP_MEDIA_DIR:-/media}
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - ./config/liquidsoap:/etc/liquidsoap:ro
      - ./priv/static/hls:/hls
      - ./tmp/media:/media:ro
      - ./tmp/radio-recovery:/recovery

volumes:
  postgres-data:
