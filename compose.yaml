services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  liquidsoap:
    image: savonet/liquidsoap:v2.4.5
    user: "${LIQUIDSOAP_UID:-100}:${LIQUIDSOAP_GID:-101}"
    init: true
    restart: unless-stopped
    command: /etc/liquidsoap/radio.liq
    volumes:
      - ./config/liquidsoap:/etc/liquidsoap:ro
      - ./priv/static/hls:/hls

volumes:
  postgres-data:
